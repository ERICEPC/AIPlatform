# Raccoon X 新前端：纯静态站点（示例数据，不连后端），部署在子路径 /raccoonx/
# 容器内挂载：/srv/site → 服务器 /srv/raccoonx/new-frontend，站点目录是 current 软链接，
# 切换版本只要改软链接，nginx 每次请求都会重新解析，不用重启容器。
server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /raccoonx {
        return 301 /raccoonx/;
    }

    # 带哈希的构建产物：长期缓存
    location ^~ /raccoonx/assets/ {
        alias /srv/site/current/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 页面与其他静态文件：页面不缓存，发新版本后刷新即可看到
    location ^~ /raccoonx/ {
        alias /srv/site/current/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    # 头像、Logo 也在根路径提供：数据里存的是 /raccoon-emoji-v1/… 这类站内绝对路径
    location ~ ^/(raccoon-emoji-v1|brand-assets)/ {
        root /srv/site/current;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /fde-tab.png {
        root /srv/site/current;
    }

    # 旧地址（根路径、/design-kit.html、/guide.html…）跳转到 /raccoonx/，# 后的页面路由由浏览器保留
    location / {
        return 302 /raccoonx$request_uri;
    }
}
