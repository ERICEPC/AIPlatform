<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLI 授权管理 · Raccoon X</title><link rel="stylesheet" href="/fde-cli/v1/authorize.css"><script defer src="/fde-cli/v1/approval-center.js"></script></head><body><main><div class="brand">Raccoon X</div><h1>CLI 授权管理</h1><p id="message" role="status">正在读取身份…</p><a id="login" hidden>登录平台</a><p id="identity"></p><form id="workspace-form"><label>空间 UUID <input id="workspace" required></label><button>打开空间</button></form><button id="copy" type="button">复制空间 UUID</button><section id="content" hidden><details id="administration" hidden><summary>管理员设置</summary><form id="access-policy"><h3>账号 CLI 准入</h3><label>账号 UUID <input name="account_id" required></label><label>操作 <select name="enabled"><option value="false">停用并撤销该账号本空间全部授权</option><option value="true">恢复申请资格（不恢复旧授权）</option></select></label><label>原因 <input name="reason" required maxlength="500"></label><button>保存准入设置</button></form><form id="delegation" hidden><h3>委派 CLI 审批管理员</h3><label>管理员账号 UUID <input name="account_id" required></label><label>操作 <select name="enabled"><option value="true">授予审批权限</option><option value="false">取消审批权限</option></select></label><button>保存审批人设置</button></form></details><h2>申请授权</h2><p>先用 CLI init 生成项目配置，填写其中的 project_id。请勿提交 Token 或密钥。</p><form id="apply"><label>项目名称 <input name="project_name" required maxlength="100"></label><label>项目 UUID <input name="project_id" required></label><label>用途 <input name="purpose" required maxlength="500"></label><fieldset><legend>操作权限</legend><label><input type="checkbox" name="actions" value="doctor" checked>环境检查</label><label><input type="checkbox" name="actions" value="list" checked>列表</label><label><input type="checkbox" name="actions" value="get" checked>详情</label><label><input type="checkbox" name="actions" value="create">创建</label><label><input type="checkbox" name="actions" value="configure">修改</label><label><input type="checkbox" name="actions" value="publish">发布</label></fieldset><label>开始时间 <input type="datetime-local" name="starts_at" required></label><label>到期时间 <input type="datetime-local" name="expires_at" required></label><p id="timezone"></p><button>提交申请</button></form><h2>申请与授权</h2><button id="mine">我的记录</button><button id="space" hidden>空间记录 / 待审批</button><div id="records"></div><button id="previous">上一页</button><button id="next">下一页</button></section></main></body></html>
