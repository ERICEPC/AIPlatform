<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消息渠道 - 商汤销售小浣熊</title><script src="/message-channels/boot.js?v=native-ui-v4"></script><link rel="icon" href="/fde-tab.png?v=channels-20260924"><link rel="stylesheet" href="/message-channels/channels.css?v=native-ui-v4"><script defer src="/message-channels/channels.js?v=team-access-20260927"></script></head>
<body><header><a href="/agents" class="brand" aria-label="返回智能体"><img class="navy" src="/brand-assets/raccoon-salesbuddy-horizontal-navy-sidebar.svg" alt="商汤销售小浣熊"><img class="white" src="/brand-assets/raccoon-salesbuddy-horizontal-white-sidebar.svg" alt="商汤销售小浣熊"></a><nav><a href="/agents">返回智能体</a><button id="theme" aria-label="切换深浅色">◐</button></nav></header>
<main><div class="eyebrow standalone">智能体 · 访问点</div><h1 class="standalone">消息渠道</h1><p class="lead standalone">在聊天软件中使用当前智能体，沿用它已发布的模型、知识库与工具。</p>
<div class="agent-context" id="agent-context"><span>通过机器人与 <strong id="agent-name">当前智能体</strong> 对话</span><span id="publish-state" class="status"></span></div><p id="publish-hint" class="publish-hint" role="status"></p>
<div id="notice" role="status" aria-live="polite"></div><section class="kinds" id="kinds" aria-label="可接入的机器人"></section>
<section class="bindings"><div class="section-heading"><div><h2>已配置的渠道</h2><p>渠道使用当前智能体的已发布版本，草稿修改需发布后生效。</p></div><button id="refresh" class="quiet">刷新状态</button></div><div id="channels"><p class="muted">正在读取配置…</p></div></section>
<details class="help"><summary>接入说明</summary><p>选择机器人类型 → 填写凭据或扫码 → 设置使用范围 → 启用渠道。</p><p>支持文字收发。飞书、钉钉、企业微信可设置群聊范围；微信 ClawBot 支持单聊。图片、文件和语音暂不转交给 Agent。</p></details></main>
<dialog id="editor" aria-labelledby="editor-title"><form id="config"><div class="dialog-heading"><div><div class="eyebrow" id="kind-name"></div><h2 id="editor-title">配置消息渠道</h2></div><button type="button" class="icon" id="close" aria-label="关闭">×</button></div><div id="form-error" role="alert"></div>
<div class="bound-agent"><span>绑定智能体</span><strong id="bound-agent-name"></strong><small>此渠道固定服务于当前智能体。</small></div><label>渠道名称<input name="name" required maxlength="80" placeholder="例如：销售知识助手"></label>
<div id="credentials"></div><section id="qr-section" hidden><button id="scan" type="button">扫码绑定</button><div id="qr" role="status"></div></section>
<div class="scope"><h3>谁可以使用</h3><label>单聊使用范围<select name="access"><option value="restricted">仅指定用户</option><option value="app_members">应用可见范围内的成员</option></select></label><label id="users-label">允许的用户 ID<textarea name="allowed_users" rows="2" placeholder="多个 ID 用换行或逗号分隔"></textarea><small>请从对应平台的成员身份中获取 ID。微信扫码后默认只允许扫码人使用。</small></label>
<label class="check" id="group-label"><input name="groups" type="checkbox">允许指定群聊中的提问</label><label id="groups-label" hidden>允许的群 ID<textarea name="allowed_groups" rows="2" placeholder="多个群 ID 用换行或逗号分隔"></textarea><small>群聊仍按上方用户范围控制。飞书、钉钉需要 @ 机器人。</small></label></div>
<div id="guide" class="guide"></div><footer><span id="save-hint">保存后仍为暂停状态。</span><button type="submit" class="primary" id="save">保存配置</button></footer></form></dialog>
<dialog id="events-dialog" aria-labelledby="events-title"><div class="dialog-heading"><h2 id="events-title">最近消息状态</h2><button class="icon" id="events-close" aria-label="关闭">×</button></div><div id="events"></div></dialog>
</body></html>
