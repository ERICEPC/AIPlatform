# Raccoon HTTPS routes and brand assets; TLS material is generated per instance.

server {
    listen 443 ssl;
    ssl_certificate /etc/raccoon/tls/server.crt;
    ssl_certificate_key /etc/raccoon/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Personal CLI authenticates with scoped tokens; browser approval requires session + CSRF.
    location ^~ /fde-cli/ {
      client_max_body_size 256k;
      set $api_upstream api:5001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$api_upstream;
    }

    location /console/api {
      set $api_upstream api:5001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$api_upstream;
    }

    location /api {
      set $api_upstream api:5001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$api_upstream;
    }

    location /socket.io/ {
      set $socket_io_upstream api_websocket:5001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$socket_io_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_cache_bypass $http_upgrade;
    }

    # Independent source-only draft-KR recommendation contract.
    location ^~ /v1/recommendations/ {
      auth_basic off; # The scoped runtime Bearer key authorizes this endpoint.
      client_max_body_size 256k;
      set $recommendation_upstream okr_gateway:5101;
      proxy_pass http://$recommendation_upstream;
    }

    # Scoped OKR runtime: installed empty, credentials and snapshots require explicit provisioning.
    location ^~ /v1/okr/ {
      client_max_body_size 256k;
      set $okr_upstream okr_gateway:5101;
      proxy_pass http://$okr_upstream;
    }

    location /v1 {
      set $api_upstream api:5001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$api_upstream;
    }

    location /openapi {
      set $api_upstream api:5001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$api_upstream;
    }

    # Tool-file signatures, expiry and file permissions are checked by the API.
    location ^~ /files/tools/ {
      limit_except GET { deny all; }
      if ($arg_timestamp = "") { return 403; }
      if ($arg_nonce = "") { return 403; }
      if ($arg_sign = "") { return 403; }
      access_log off;
      add_header Cache-Control "private, no-store" always;
      add_header Referrer-Policy "no-referrer";
      set $api_upstream api:5001;
      proxy_pass http://$api_upstream;
    }

    location /files {
      set $api_upstream api:5001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$api_upstream;
    }

    location /explore {
      set $web_upstream web:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$web_upstream;
    }

    location /e/ {
      set $plugin_daemon_upstream plugin_daemon:5002;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$plugin_daemon_upstream;
      proxy_set_header Dify-Hook-Url $scheme://$http_host$request_uri;
    }

    location = /super-fde-workspaces.js {
      alias /opt/brand/super-fde-workspaces.js;
      default_type application/javascript;
      add_header Cache-Control "no-cache";
    }
    location ^~ /brand-assets/ {
      alias /opt/brand/brand-assets/;
      types { image/svg+xml svg; image/png png; }
      add_header Cache-Control "no-cache";
    }
    location = /raccoon-salesbuddy.png {
      alias /opt/brand/raccoon-salesbuddy.png;
      default_type image/png;
      add_header Cache-Control "no-cache";
    }
    location = /brand-bootstrap.js {
      alias /opt/brand/brand-bootstrap.js;
      default_type application/javascript;
      add_header Cache-Control "no-cache";
    }
    location = /favicon.ico {
      alias /opt/brand/fde-tab.png;
      default_type image/png;
      add_header Cache-Control "no-cache";
    }
    location = /fde-tab.png {
      alias /opt/brand/fde-tab.png;
      default_type image/png;
      add_header Cache-Control "no-cache";
    }

    # ERIC_TEAM_THEME_ASSET
    location = /team-ui.css {
      alias /opt/brand/team-ui.css;
      default_type text/css;
      add_header Cache-Control "no-cache";
    }

    location ^~ /raccoon-emoji-v1/ {
      alias /opt/brand/raccoon-emoji-v1/;
    }
    location = /message-channels { return 302 /message-channels/; }
    location ^~ /message-channels/ {
      alias /opt/brand/message-channels/;
      index index.html;
    }
    location / {
      # ERIC_TEAM_THEME_HTML
      proxy_set_header Accept-Encoding "";
      sub_filter '<head>' '<head><script src="/brand-bootstrap.js?v=2"></script><link rel="stylesheet" href="/team-ui.css?v=raccoonx-20261017">';
      sub_filter '</head>' '<script defer src="/message-channels/entry.js?v=20261017"></script><script defer src="/super-fde-workspaces.js?v=raccoon-20260914"></script></head>';
      sub_filter '<title>Dify</title>' '<title>Raccoon X</title>';
      sub_filter ' - Dify</title>' ' - Raccoon X</title>';
      sub_filter 'Super FDE Team' 'Raccoon X';
      sub_filter 'Supreme FDE' 'Raccoon X';
      sub_filter_once off;
      set $web_upstream web:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$web_upstream;
    }

    location /mcp {
      set $api_upstream api:5001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$api_upstream;
    }

    location /triggers {
      set $api_upstream api:5001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://$api_upstream;
    }
    
    # placeholder for acme challenge location
    

    # placeholder for https config defined in https.conf.template
    # Raccoon HTTPS routes and brand assets; TLS material is generated per instance.

}
